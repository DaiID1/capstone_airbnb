name: capstone_airbnb
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  carousel_slider: ^5.1.1
  firebase_auth: ^6.5.7
  google_sign_in: ^6.2.1
  provider: ^6.1.5+1
  smooth_page_indicator: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/airbnb_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/